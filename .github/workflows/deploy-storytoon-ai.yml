name: Deploy storytoon-ai function

on:
  push:
    paths:
      - 'supabase/functions/storytoon-ai/**'
      - '.github/workflows/deploy-storytoon-ai.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy storytoon-ai --no-verify-jwt --project-ref bfofrgqdvqehdsiccyhk
